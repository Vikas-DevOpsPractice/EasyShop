apiVersion: batch/v1
kind: Job
metadata:
  name: easyshop-migration-job
  labels:
    app: easyshop
spec:
  template:
    metadata:
      labels:
        app: easyshop
    spec:
      containers:
      - name: easyshop-migration-job
        image: easyshop:latest
        command: [ "python", "manage.py", "migrate" ]
      restartPolicy: Never
  backoffLimit: 4
  completions: 1
  parallelism: 1
